services:
  web:
    build: .
    environment: &marketflow_environment
      POSTGRES_DB: ${POSTGRES_DB:-marketflow}
      POSTGRES_USER: ${POSTGRES_USER:-marketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketflow_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-marketflow-local-development-only}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-120}
      PRODUCT_IMAGE_BASE_URL: ${PRODUCT_IMAGE_BASE_URL:?Set PRODUCT_IMAGE_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8001}:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  checkout-expiry:
    build: .
    environment: *marketflow_environment
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "expire_orders", "--watch"]
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketflow}
      POSTGRES_USER: ${POSTGRES_USER:-marketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketflow_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
